name: caaqil

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PANEL_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PANEL_DB_NAME:-caaqil}
      MYSQL_USER: ${PANEL_DB_USER:-caaqil}
      MYSQL_PASSWORD: ${PANEL_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - panel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${PANEL_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${PANEL_NETWORK:-caaqil}
      - --providers.file.directory=/edge
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ${CAAQIL_EDGE_DIR:-/opt/caaqil/edge}:/edge:ro
    networks:
      - panel

  panel:
    build:
      context: .
      args:
        CAAQIL_COMMIT: ${CAAQIL_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CAAQIL_AUTO_ADMIN: ${CAAQIL_AUTO_ADMIN:-false}
      PANEL_DB_HOST: mysql
      PANEL_DB_PORT: 3306
      PANEL_DB_USER: ${PANEL_DB_USER:-caaqil}
      PANEL_DB_PASSWORD: ${PANEL_DB_PASSWORD}
      PANEL_DB_NAME: ${PANEL_DB_NAME:-caaqil}
      DATA_DIR: /app/data
      HOST_DATA_DIR: ${CAAQIL_DATA_DIR:-/opt/caaqil/data}
      DOCKER_SOCKET: /var/run/docker.sock
      PANEL_NETWORK: ${PANEL_NETWORK:-caaqil}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      PANEL_URL: https://${PANEL_DOMAIN}
      EDGE_DIR: /edge
      NEXT_PUBLIC_PANEL_NAME: ${PANEL_NAME:-Caaqil}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CAAQIL_COMMIT: ${CAAQIL_COMMIT:-unknown}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CAAQIL_DATA_DIR:-/opt/caaqil/data}:/app/data
      - ${CAAQIL_EDGE_DIR:-/opt/caaqil/edge}:/edge
    networks:
      - panel

  # Tiny sidecar that owns the git checkout and the Docker socket. The panel
  # asks it to check GitHub and to rebuild only the panel service, so the
  # updater keeps running while the panel container is recreated.
  updater:
    build:
      context: .
      dockerfile: scripts/updater.Dockerfile
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      CAAQIL_INSTALL_DIR: /repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CAAQIL_INSTALL_DIR:-/opt/caaqil}:/repo
    networks:
      - panel

volumes:
  mysql-data:
    name: ${CAAQIL_MYSQL_VOLUME:-caaqil-mysql}
  letsencrypt:
    name: ${CAAQIL_LETSENCRYPT_VOLUME:-caaqil-letsencrypt}

networks:
  panel:
    name: ${PANEL_NETWORK:-caaqil}
    driver: bridge
